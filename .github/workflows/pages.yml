name: Deploy site to GitHub Pages

# Deploys the committed site/ folder. The site is built locally from the private career-hub
# repo (make site), because the sources live there. Not enabled until Jack publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
